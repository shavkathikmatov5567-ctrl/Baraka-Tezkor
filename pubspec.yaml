name: Baraka_Tezkor
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  change_app_package_name: ^1.4.0
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.13.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Расмлар жойлашган папкани иловага танитиш:
  assets:
    - assets/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png" # Сизнинг логотипингиз йўли
  min_sdk_android: 21
